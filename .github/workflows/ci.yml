name: CI

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Check internal links
        run: >-
          bundle exec htmlproofer ./_site
          --disable-external
          --no-enforce-https
          --allow-missing-href
          --checks Links
